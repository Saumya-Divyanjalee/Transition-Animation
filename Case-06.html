<!DOCTYPE html>
<html>
<head>
    <title>Car Animation</title>
    <style>

        body {
            margin: 0;
            overflow: hidden;
        }

        .main {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }


        .sky {
            position: absolute;
            width: 100%;
            height: 100vh;
        }

        .sky img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }


        .city {
            position: absolute;
            bottom: 35vh;
            width: 400vw;
            height: 40vh;
            display: flex;
            animation: moveCity 10s linear infinite;
        }

        .city img {
            width: 100vw;
            height: 40vh;
            object-fit: cover;
        }


        .road {
            position: absolute;
            bottom: 0;
            width: 400vw;
            height: 35vh;
            display: flex;
            animation: moveRoad 5s linear infinite;
        }

        .road img {
            width: 100vw;
            height: 35vh;
            object-fit: cover;
        }


        .car {
            position: absolute;
            width: 350px;
            height: 150px;
            top: 58vh;
            left: 45vw;
        }

        .car img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }


        .wheel1, .wheel2 {
            position: absolute;
            top: 69vh;
            animation: rotateWheel 1s linear infinite;
        }

        .wheel1 {
            left: 62.50vw;
        }

        .wheel2 {
            left: 46.80vw;
        }

        .wheel1 img, .wheel2 img {
            width: 65px;
            height: 65px;
            object-fit: contain;
        }


        @keyframes moveCity {
            from {
                transform: translateX(0);
            }
            to {
                transform: translateX(-300vw);
            }
        }

        @keyframes moveRoad {
            from {
                transform: translateX(0);
            }
            to {
                transform: translateX(-300vw);
            }
        }

        @keyframes rotateWheel {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(720deg);
            }
        }
    </style>
</head>
<body>
<main class="main">
    <section class="sky">
        <div><img src="assets/images/sky.jpg" alt="sky"></div>
    </section>

    <section class="city">
        <div><img src="assets/images/city.png" alt="city"></div>
        <div><img src="assets/images/city.png" alt="city"></div>
        <div><img src="assets/images/city.png" alt="city"></div>
        <div><img src="assets/images/city.png" alt="city"></div>
    </section>

    <section class="road">
        <div><img src="assets/images/road.jpg" alt="road"></div>
        <div><img src="assets/images/road.jpg" alt="road"></div>
        <div><img src="assets/images/road.jpg" alt="road"></div>
        <div><img src="assets/images/road.jpg" alt="road"></div>
    </section>

    <section class="car">
        <div><img src="assets/images/car.png" alt="car"></div>
    </section>

    <div class="wheel1"><img src="assets/images/wheel.png" alt="wheel"></div>
    <div class="wheel2"><img src="assets/images/wheel.png" alt="wheel"></div>
</main>
</body>
</html>
